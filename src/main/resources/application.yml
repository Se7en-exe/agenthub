spring:
  application:
    name: agenthub
  profiles:
    active: local
  # 知识库上传：默认单文件只允许 1MB，放开到 20MB 才够传一份 PDF
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
# 临时注释掉，便于大家开发调试和部署（实际填写 PgVector 数据库信息）
#  datasource:
#    url: xxx
#    username: root
#    password: 123456
  ai:
    # Chat 用自己实现的 ChatModelProvider（支持运行期换 key），所以关掉自动配置，避免两个 ChatModel 打架
    model:
      chat: none
      embedding: transformers
    openai:
      # DeepSeek 完全兼容 OpenAI 协议，改 base-url 即可
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:sk-please-set-env}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-flash}
          temperature: 0.7
    # 本地 ONNX 向量模型（bge-small-zh-v1.5，512 维），模型文件随包分发，不联网
    embedding:
      transformer:
        tokenizer:
          uri: classpath:/onnx/tokenizer.json
        onnx:
          model-uri: classpath:/onnx/model_quantized.onnx
          model-output-name: last_hidden_state
        cache:
          enabled: false
# 临时注释掉，便于大家开发调试和部署（实际需要启动 MCP 服务）
#    mcp:
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
# 临时注释掉，便于大家开发调试和部署（实际需要启动 PgVector 数据库）
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 512
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000
server:
  # 端口支持环境变量覆盖，默认 8123
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api
  # 知识库上传：Spring 默认单文件只允许 1MB，放开到 20MB 才够传一份 PDF
  tomcat:
    max-swallow-size: 30MB
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lws.agenthub.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # 从环境变量 SEARCH_API_KEY 读取；没配时退化为占位符，只影响网页搜索工具
  api-key: ${SEARCH_API_KEY:your-search-api-key}
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: INFO